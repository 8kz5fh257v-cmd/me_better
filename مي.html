<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام حياتي</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حياتي">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
<style>
:root{
  --bg:#0a0a14; --bg2:#12121f; --card:#161626; --text:#eee7f5; --muted:#9088a8;
  --spiritual:#a78bfa; --intellectual:#38bdf8; --body:#4ade80; --social:#fb923c; --finance:#fbbf24; --career:#f472b6;
  --gold:#e8c766; --glow: rgba(232,199,102,.45);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;overflow-x:hidden;}
body{background:radial-gradient(ellipse at 50% 20%, #1a1530 0%, var(--bg) 65%);min-height:100%;}
.stars{position:fixed;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 60%,#fff6,transparent),radial-gradient(1px 1px at 40% 80%,#fff5,transparent),radial-gradient(1.5px 1.5px at 85% 20%,#fff7,transparent);opacity:.5;pointer-events:none;z-index:0;}
header{text-align:center;padding:22px 16px 6px;position:relative;z-index:1;}
header h1{margin:0;font-size:1.3rem;letter-spacing:1px;font-weight:600;background:linear-gradient(90deg,var(--gold),#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.wrap{max-width:520px;margin:0 auto;padding:10px 16px 40px;position:relative;z-index:1;}
.hexgrid{position:relative;width:100%;aspect-ratio:1/1;max-width:420px;margin:20px auto 8px;}
.hexgrid svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0;}
.hexgrid svg.links path{fill:none;stroke:url(#linkGrad);stroke-width:1.4;opacity:.55;stroke-dasharray:6 5;animation:dashmove 6s linear infinite;}
.hexgrid svg.links path.spoke{stroke-dasharray:2 6;opacity:.4;animation:dashmove 4s linear infinite;}
.hexgrid svg.links path.hex{stroke-width:1.8;opacity:.7;stroke-dasharray:8 4;animation:dashmove 10s linear infinite;}
@keyframes dashmove{to{stroke-dashoffset:-100;}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes pulseGlow{0%,100%{box-shadow:inset -8px -10px 18px -6px #00000090,inset 4px 5px 10px -3px #ffffff30,0 10px 18px -6px #000000aa,0 0 18px -4px var(--c);}50%{box-shadow:inset -8px -10px 18px -6px #00000090,inset 4px 5px 10px -3px #ffffff30,0 10px 18px -6px #000000aa,0 0 32px 3px var(--c);}}
@keyframes centerPulse{0%,100%{box-shadow:inset -10px -12px 20px -6px #00000095,inset 5px 6px 12px -4px #ffffff25,0 0 30px var(--glow);}50%{box-shadow:inset -10px -12px 20px -6px #00000095,inset 5px 6px 12px -4px #ffffff25,0 0 46px 6px var(--glow);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.hexpoint{position:absolute;width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid color-mix(in srgb, var(--c) 55%, transparent);background:radial-gradient(circle at 32% 26%, #ffffff35, transparent 32%),radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--c) 45%, var(--bg2)) 0%, var(--bg2) 70%);box-shadow:inset -8px -10px 18px -6px #00000090,inset 4px 5px 10px -3px #ffffff30,0 10px 18px -6px #000000aa;filter:grayscale(1) brightness(.35);opacity:.25;transition:left .85s cubic-bezier(.2,.8,.2,1), top .85s cubic-bezier(.2,.8,.2,1), filter .9s ease .1s, opacity .9s ease, transform .2s;z-index:1;}
.hexpoint.live{filter:none;opacity:1;box-shadow:inset -8px -10px 18px -6px #00000090,inset 4px 5px 10px -3px #ffffff30,0 10px 18px -6px #000000aa,0 0 18px -4px var(--c);}
.hexpoint.animate{animation:floaty 5s ease-in-out infinite, pulseGlow 3.5s ease-in-out infinite;}
.hexpoint:active{transform:scale(.9);}
.hexpoint .ic{width:30px;height:30px;stroke:var(--c);}
.hexpoint .lb{font-size:.72rem;margin-top:2px;color:var(--text);opacity:.9;}
.hexpoint .bar{width:60px;height:4px;border-radius:3px;background:#ffffff22;margin-top:6px;overflow:hidden;}
.hexpoint .bar i{display:block;height:100%;background:var(--c);width:0%;transition:width .5s;}
.alertDot{position:absolute;top:6px;left:6px;width:11px;height:11px;border-radius:50%;background:#f87171;box-shadow:0 0 8px #f87171;animation:alertPulse 1.6s ease-in-out infinite;}
@keyframes alertPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:.6;}}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 32% 26%, #ffffff40, transparent 30%),radial-gradient(circle at 40% 30%, #352a5c, #100c1e 75%);border:1px solid color-mix(in srgb, var(--gold) 60%, transparent);box-shadow:inset -10px -12px 20px -6px #00000095,inset 5px 6px 12px -4px #ffffff25;animation:centerPulse 3.5s ease-in-out infinite, fadeUp .5s backwards;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:8px;z-index:2;}
.center:active{transform:translate(-50%,-50%) scale(.94);}
.center .pt{font-size:.68rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
.center .pv{font-size:.72rem;margin-top:4px;color:var(--muted);max-width:110px;line-height:1.3;}
.orbitRing{position:absolute;top:50%;left:50%;width:1px;height:1px;z-index:3;pointer-events:none;}
.orbitDot{position:absolute;top:0;left:0;width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--gold));box-shadow:0 0 10px 2px var(--glow);animation:orbit 16s linear infinite;pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;color:#3a2c00;font-weight:700;}
@keyframes orbit{from{transform:rotate(0deg) translateX(100px) rotate(0deg);}to{transform:rotate(360deg) translateX(100px) rotate(-360deg);}}
.orbitEmpty{position:absolute;top:0;left:0;width:100px;height:100px;margin:-50px;border:1px dashed #ffffff20;border-radius:50%;animation:spin 30s linear infinite;pointer-events:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.moonOrbit{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8e8f0,#9797ab 60%,#5a5a6e);box-shadow:0 0 14px 2px #ffffff55;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;z-index:4;animation:moonOrbit 22s linear infinite;}
@keyframes moonOrbit{from{transform:rotate(0deg) translateX(85px) rotate(0deg);}to{transform:rotate(-360deg) translateX(85px) rotate(360deg);}}
.landingFlash{position:fixed;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000) 100%);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent),0 0 50px var(--c);z-index:15;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center;transform:scale(1) rotate(0deg);}
.landingFlash.go{animation:landingZoom 1.4s cubic-bezier(.3,.1,.2,1) forwards;}
@keyframes landingZoom{
  0%{opacity:1;transform:scale(1) rotate(0deg);}
  4%{transform:scale(1.01) rotate(20deg);}
  8%{transform:scale(1.03) rotate(40deg);}
  12%{transform:scale(1.05) rotate(60deg);}
  16%{transform:scale(1.07) rotate(80deg);}
  20%{transform:scale(1.09) rotate(100deg);}
  24%{transform:scale(1.11) rotate(122deg);}
  28%{transform:scale(1.13) rotate(145deg);}
  32%{transform:scale(1.16) rotate(168deg);}
  36%{transform:scale(1.19) rotate(192deg);}
  40%{transform:scale(1.22) rotate(216deg);}
  44%{transform:scale(1.25) rotate(242deg);}
  48%{transform:scale(1.29) rotate(268deg);}
  52%{transform:scale(1.33) rotate(296deg);}
  56%{transform:scale(1.4) rotate(326deg);}
  60%{transform:scale(1.55) rotate(358deg);}
  66%{transform:scale(2.4) rotate(400deg);}
  73%{transform:scale(5) rotate(440deg);}
  80%{opacity:1;transform:scale(13) rotate(480deg);}
  100%{opacity:0;transform:scale(26) rotate(520deg);}
}
.sheet{max-width:480px;margin:0 auto;padding:20px 18px calc(40px + env(safe-area-inset-bottom,0px));min-height:100%;animation:sheetIn .3s ease-out backwards;}
@keyframes sheetIn{0%{opacity:0;transform:translateY(10px) scale(.9);filter:blur(6px);}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}
.quote{max-width:420px;margin:6px auto 18px;text-align:center;font-size:.8rem;color:var(--muted);font-style:italic;padding:0 20px;min-height:2.2em;}
.quote b{color:var(--gold);font-style:normal;}
.aibtn{display:block;width:100%;max-width:420px;margin:0 auto 14px;padding:13px;border-radius:14px;border:1px solid #ffffff22;background:linear-gradient(135deg,#2a1f45,#1a1430);color:var(--text);font-size:.9rem;cursor:pointer;text-align:center;}
.aibtn:active{opacity:.8;}

/* overlay */
.ov{position:fixed;inset:0;background:#05050ae0;backdrop-filter:blur(6px);z-index:10;display:none;overflow-y:auto;}
.ov.show{display:block;}
.inlineForm{display:flex;flex-direction:column;gap:8px;background:var(--bg2);border:1px solid #ffffff22;border-radius:12px;padding:10px;margin-top:8px;}
.inlineForm .fbtns{display:flex;gap:8px;}
.inlineForm button{flex:1;border:none;border-radius:8px;padding:8px;font-size:.8rem;cursor:pointer;}
.inlineForm .ok{background:var(--gold);color:#1a1430;font-weight:600;}
.inlineForm .cancel{background:#ffffff18;color:var(--text);}
.tagchip{display:inline-block;padding:4px 9px;border-radius:20px;font-size:.72rem;margin:2px;cursor:pointer;border:1px solid #ffffff33;color:var(--text);}
.tagchip.on{border-color:transparent;color:#111;}
.dayRow{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:10px;padding:8px 10px;margin-bottom:6px;}
.dayRow .dname{width:56px;font-size:.75rem;color:var(--muted);flex-shrink:0;}
.dayRow input[type=text]{flex:1;background:none;border:none;font-size:.82rem;padding:2px;}
.dayRow input[type=checkbox]{width:19px;height:19px;flex-shrink:0;}
.miniStat{display:flex;gap:8px;margin-top:8px;}
.miniStat .box{flex:1;background:var(--bg2);border-radius:10px;padding:10px;text-align:center;}
.miniStat .box b{display:block;font-size:1.15rem;color:var(--c);}
.miniStat .box span{font-size:.68rem;color:var(--muted);}
.prayerGrid{display:flex;gap:6px;flex-wrap:wrap;}
.prayerChip{flex:1;min-width:60px;text-align:center;padding:10px 4px;border-radius:12px;background:var(--bg2);border:1.5px solid #ffffff22;cursor:pointer;font-size:.75rem;transition:.2s;}
.prayerChip.done{background:color-mix(in srgb,var(--c) 30%, var(--bg2));border-color:var(--c);color:var(--c);}
.istigBtn{width:100%;padding:16px;border-radius:14px;background:radial-gradient(circle,color-mix(in srgb,var(--c) 25%,var(--bg2)),var(--bg2));border:1.5px solid var(--c);color:var(--text);font-size:1rem;cursor:pointer;margin-top:8px;}
.istigBtn b{display:block;font-size:1.6rem;color:var(--c);}
.circleRow{margin-top:10px;}
.circleRow h4{margin:0 0 6px;font-size:.78rem;color:var(--c);}
.pRow{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:10px;padding:8px 10px;margin-bottom:6px;}
.pRow .pname{flex:1;font-size:.83rem;}
.pRow .plast{font-size:.68rem;color:var(--muted);}
.pRow button{background:var(--c);border:none;color:#111;font-size:.68rem;padding:5px 9px;border-radius:8px;cursor:pointer;}
.ledgerRow{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.8rem;}
.ledgerRow .amt.in{color:#4ade80;} .ledgerRow .amt.out{color:#f87171;} .ledgerRow .amt.invest{color:#fbbf24;}
.subjRow{background:var(--bg2);border-radius:10px;padding:10px;margin-bottom:8px;}
.subjRow .stop{display:flex;justify-content:space-between;align-items:center;}
.subjRow input[type=text]{background:none;border:none;font-weight:600;font-size:.88rem;flex:1;}
.modeSel{display:flex;gap:8px;margin-bottom:10px;}
.modeSel button{flex:1;padding:9px;border-radius:10px;border:1.5px solid #ffffff22;background:var(--bg2);color:var(--text);cursor:pointer;font-size:.8rem;}
.modeSel button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 25%,var(--bg2));color:var(--c);}
.sheet-top{display:flex;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top,0px);}
.close{background:none;border:1px solid #ffffff33;color:var(--text);width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;}
.sheet h2{display:flex;align-items:center;gap:8px;font-size:1.2rem;margin:14px 0 4px;}
.section{background:var(--card);border:1px solid #ffffff14;border-inline-start:3px solid var(--c,var(--gold));border-radius:16px;padding:14px;margin-top:14px;animation:fadeUp .4s ease backwards;}
.section h3{margin:0 0 10px;font-size:.85rem;color:var(--muted);font-weight:600;}
textarea,input[type=text],input[type=number],input[type=date]{width:100%;background:var(--bg2);border:1px solid #ffffff22;color:var(--text);border-radius:10px;padding:9px 11px;font-size:.88rem;font-family:inherit;}
textarea{resize:vertical;min-height:44px;}
.row{display:flex;gap:8px;margin-bottom:8px;}
.row>*{flex:1;}
.miniLbl{font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block;}
.bar2{height:8px;border-radius:5px;background:#ffffff18;overflow:hidden;margin-top:8px;}
.bar2 i{display:block;height:100%;width:0%;background:var(--c);border-radius:5px;}
.goal{background:var(--bg2);border:1px solid #ffffff14;border-radius:12px;padding:10px;margin-top:8px;}
.goal .gtop{display:flex;align-items:center;gap:8px;}
.goal input[type=checkbox]{width:18px;height:18px;accent-color:var(--c);}
.goal .gname{flex:1;background:none;border:none;color:var(--text);font-size:.88rem;}
.badges{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.badge{width:10px;height:10px;border-radius:50%;}
.smallbtn{background:none;border:1px dashed #ffffff33;color:var(--muted);border-radius:10px;padding:8px;width:100%;font-size:.8rem;cursor:pointer;margin-top:8px;}
.field{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.field .fname{width:38%;font-size:.78rem;color:var(--muted);}
.del{background:none;border:none;color:#ff6b6b88;font-size:1.1rem;cursor:pointer;padding:0 4px;}
.chip{display:inline-block;font-size:.68rem;padding:3px 8px;border-radius:20px;margin-inline-end:4px;margin-top:2px;}
.streak{font-size:.75rem;color:var(--gold);margin-top:4px;}
.person{background:var(--bg2);border-radius:12px;padding:10px;margin-top:8px;}
.aiOut{white-space:pre-wrap;font-size:.85rem;line-height:1.7;color:var(--text);}
.loading{color:var(--muted);font-size:.85rem;}
</style>
</head>
<body>
<div class="stars"></div>
<header><h1>✦ نظام حياتي ✦</h1>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;">
    <button id="exportBtn" style="background:none;border:1px solid #ffffff33;color:var(--muted);border-radius:10px;padding:5px 10px;font-size:.68rem;cursor:pointer;">⬇️ نسخة احتياطية</button>
    <label style="background:none;border:1px solid #ffffff33;color:var(--muted);border-radius:10px;padding:5px 10px;font-size:.68rem;cursor:pointer;">⬆️ استرجاع<input type="file" id="importInput" accept="application/json" style="display:none;"></label>
  </div>
</header>
<div class="wrap">
  <div class="hexgrid" id="hexgrid">
    <div class="center" id="centerBtn">
      <div class="pt">Purpose</div>
      <div class="pv" id="purposePreview">دوس لكتابة رؤيتك</div>
    </div>
    <div class="orbitRing" id="orbitRing"></div>
    <div class="moonOrbit" id="moonBtn" title="New Habits">🌙</div>
  </div>
  <div class="quote" id="quoteBox"></div>
  <button class="aibtn" id="aiOverviewBtn">🔮 نظرة شاملة من الذكاء الاصطناعي</button>
</div>

<!-- Node overlay -->
<div class="ov" id="nodeOv">
  <div class="landingFlash" id="landingFlash"></div>
  <div class="sheet">
    <div class="sheet-top"><button class="close" onclick="closeOv('nodeOv')">✕</button></div>
    <h2 id="nodeTitle"></h2>
    <div id="specialPanel"></div>
    <div class="section" id="genWhereAt">
      <h3>فين واقف؟</h3>
      <textarea id="whereAt" placeholder="اكتب وصف موقفك الحالي..."></textarea>
    </div>
    <div class="section" id="genWhereTo">
      <h3>فين عايز توصل؟</h3>
      <textarea id="whereTo" placeholder="اكتب هدفك..."></textarea>
      <div class="bar2"><i id="nodeBar"></i></div>
      <input type="range" min="0" max="100" value="30" id="progressSlider" style="width:100%;margin-top:8px;">
    </div>
    <div class="section" id="genFields">
      <h3>حقول مخصصة</h3>
      <div id="customFields"></div>
      <button class="smallbtn" onclick="addField()">+ ضيف حقل</button>
    </div>
    <div class="section">
      <h3 id="goalsHeading">الأهداف والمهام</h3>
      <div id="goalsList"></div>
      <button class="smallbtn" onclick="addGoal()">+ ضيف هدف/مهمة</button>
    </div>
    <div class="section">
      <h3>سجل آخر 14 يوم</h3>
      <div class="bar2" style="height:40px;display:flex;align-items:flex-end;gap:2px;background:none;" id="miniHistory"></div>
    </div>
    <button class="aibtn" onclick="askAiNode()">💬 اتكلم مع الـ AI عن الحتة دي</button>
    <div id="nodeAiOut" class="section" style="display:none;"><div class="aiOut" id="nodeAiText"></div></div>
  </div>
</div>

<!-- Purpose overlay -->
<div class="ov" id="purposeOv">
  <div class="sheet">
    <div class="sheet-top"><button class="close" onclick="closeOv('purposeOv')">✕</button></div>
    <h2>🎯 Purpose</h2>
    <div class="section">
      <h3>رؤيتك</h3>
      <textarea id="purposeText" placeholder="اكتب رؤيتك اللي بتوجه حياتك..." style="min-height:80px;"></textarea>
    </div>
    <div class="section">
      <h3>مؤشر الاتساق</h3>
      <div class="bar2"><i id="alignBar" style="background:var(--gold);"></i></div>
      <div class="miniLbl" id="alignLbl" style="margin-top:6px;"></div>
    </div>
    <div class="section">
      <h3>✨ القدوات والعبارات الملهمة</h3>
      <div id="mentorsList"></div>
      <div class="row" style="margin-top:8px;">
        <input type="text" id="mentorName" placeholder="اسم الشخص">
      </div>
      <textarea id="mentorQuote" placeholder="العبارة الملهمة..."></textarea>
      <button class="smallbtn" onclick="addMentor()">+ ضيف قدوة</button>
    </div>
  </div>
</div>

<!-- Habits overlay -->
<div class="ov" id="habitsOv">
  <div class="sheet">
    <div class="sheet-top"><button class="close" onclick="closeOv('habitsOv')">✕</button></div>
    <h2>🌙 New Habits</h2>
    <div class="section">
      <h3>عادات بتتعمل ريفريش كل يوم</h3>
      <div id="habitsList"></div>
      <div class="inlineForm">
        <input type="text" id="habitNewName" placeholder="عادة جديدة عايز تبنيها...">
        <button class="ok" id="habitAddBtn" style="background:var(--gold);color:#1a1430;border-radius:8px;padding:9px;">+ ضيف عادة</button>
      </div>
    </div>
  </div>
</div>

<!-- AI overview overlay -->
<div class="ov" id="aiOv">
  <div class="sheet">
    <div class="sheet-top"><button class="close" onclick="closeOv('aiOv')">✕</button></div>
    <h2>🔮 نظرة شاملة</h2>
    <div class="section"><div class="aiOut" id="aiOverviewText">جاري التحليل...</div></div>
  </div>
</div>

<script>
const ICONS = {
  spiritual:'<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.8 2.8M16.2 16.2 19 19M19 5l-2.8 2.8M7.8 16.2 5 19"/>',
  intellectual:'<path d="M4 19V6a2 2 0 0 1 2-2h5v17H6a2 2 0 0 1-2-2Z"/><path d="M20 19V6a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 0 2-2Z"/>',

// layout hexagon points + connector lines
function layout(){
  const grid = document.getElementById('hexgrid');
  const R = 150, CX=210, CY=210; // in svg viewbox units (0-420)
  const pts = CATS.map((c,i)=>{
    const angle = (-90 + i*60) * Math.PI/180;
    return {x: CX + R*Math.cos(angle), y: CY + R*Math.sin(angle)};
  });

  let svg = document.getElementById('linksSvg');
  if(!svg){
    svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','links'); svg.setAttribute('id','linksSvg');
    svg.setAttribute('viewBox','0 0 420 420');
    svg.innerHTML = `<defs><linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--gold)"/><stop offset="100%" stop-color="#8b7cf6"/>
    </linearGradient></defs>`;
    grid.insertBefore(svg, grid.firstChild);
  }
  // hexagon outline
  const outline = pts.map(p=>`${p.x},${p.y}`).join(' L ');
  let hexPath = svg.querySelector('.hex');
  if(!hexPath){ hexPath = document.createElementNS('http://www.w3.org/2000/svg','path'); hexPath.setAttribute('class','hex'); svg.appendChild(hexPath); }
  hexPath.setAttribute('d', `M ${outline} Z`);
  // spokes to center
  pts.forEach((p,i)=>{
    let sp = svg.querySelector('.spoke'+i);
    if(!sp){ sp = document.createElementNS('http://www.w3.org/2000/svg','path'); sp.setAttribute('class','spoke spoke'+i); svg.appendChild(sp); }
    sp.setAttribute('d', `M ${CX} ${CY} L ${p.x} ${p.y}`);
  });

  CATS.forEach((c,i)=>{
    let el = document.getElementById('pt_'+c.id);
    let isNew = false;
    if(!el){
      isNew = true;
      el = document.createElement('div');
      el.className='hexpoint';
      el.id='pt_'+c.id;
      el.style.setProperty('--c', c.c);
      el.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[c.id]}</svg><div class="lb">${c.name}</div><div class="bar"><i></i></div>`;
      el.onclick = ()=>openNode(c.id, el);
      // spawn from center, dim, invisible
      el.style.left = 'calc(50% - 52px)'; el.style.top = 'calc(50% - 52px)';
      grid.appendChild(el);
    }
    const finalLeft = `calc(${(pts[i].x/420)*100}% - 52px)`;
    const finalTop = `calc(${(pts[i].y/420)*100}% - 52px)`;
    if(isNew){
      requestAnimationFrame(()=> requestAnimationFrame(()=>{
        setTimeout(()=>{
          el.style.left = finalLeft; el.style.top = finalTop;
          el.classList.add('live');
          setTimeout(()=> el.classList.add('animate'), 950);
        }, i*160);
      }));
    } else { el.style.left = finalLeft; el.style.top = finalTop; }
    el.querySelector('.bar i').style.width = DATA.nodes[c.id].progress+'%';
    let dot = el.querySelector('.alertDot');
    if(needsAttention(c.id)){ if(!dot){ dot=document.createElement('div'); dot.className='alertDot'; el.appendChild(dot); } }
    else if(dot) dot.remove();
  });
}
const ARDAY = ['حد','اتنين','تلات','اربع','خميس','جمعة','سبت'];
function needsAttention(id){
  const n = DATA.nodes[id];
  if(id==='spiritual') return Object.values(n.prayers).filter(Boolean).length < 5;
  if(id==='body') return (n.recurring||[]).some(r=> r.lastDone && (r.interval - Math.floor((new Date(today())-new Date(r.lastDone))/86400000)) <= 0);
  if(id==='career'){
    const todayLabel = ARDAY[new Date().getDay()];
    return (n.subjects||[]).some(s=> (s.events||[]).some(ev=> ev.day===todayLabel && !ev.attended));
  }
  return false;
}

function openHabits(){ renderHabits(); document.getElementById('habitsOv').classList.add('show'); }
function renderHabits(){
  const c = document.getElementById('habitsList');
  c.innerHTML = DATA.habits.map((h,i)=>{
    const doneToday = h.dates.includes(today());
    const streak = computeHabitStreak(h);
    return `<div class="goal"><div class="gtop"><input type="checkbox" class="hDone" data-i="${i}" ${doneToday?'checked':''}><span class="gname" style="${doneToday?'opacity:.6;text-decoration:line-through;':''}">${h.name}</span><button class="del hDel" data-i="${i}">✕</button></div><div class="streak" style="margin-top:4px;">🔥 ${streak} يوم متتالي — إجمالي ${h.dates.length}</div></div>`;
  }).join('') || '<span class="miniLbl">لسه مفيش عادات مضافة</span>';
  c.querySelectorAll('.hDone').forEach(cb=> cb.onchange=(e)=>{
    const h = DATA.habits[+cb.dataset.i]; const d = today();
    if(e.target.checked){ if(!h.dates.includes(d)) h.dates.push(d); } else { h.dates = h.dates.filter(x=>x!==d); }
    save(); renderHabits(); layout();
  });
  c.querySelectorAll('.hDel').forEach(b=> b.onclick=()=>{ DATA.habits.splice(+b.dataset.i,1); save(); renderHabits(); });
}
function computeHabitStreak(h){
  let s=0, d=new Date();
  while(true){ const key=d.toISOString().slice(0,10); if(h.dates.includes(key)){ s++; d.setDate(d.getDate()-1); } else break; }
  return s;
}

let currentNode = null;
function openNode(id, srcEl){
  currentNode = id;
  const cat = CATS.find(c=>c.id===id);
  const n = DATA.nodes[id];
  const ov = document.getElementById('nodeOv');
  ov.classList.remove('show');

  flash.style.setProperty('--c', cat.c);
  flash.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:60%;height:60%;">${ICONS[id]}</svg>`;
  if(srcEl){
    const r = srcEl.getBoundingClientRect();
    flash.style.left = (r.left + r.width/2) + 'px';
    flash.style.top = (r.top + r.height/2) + 'px';
  } else { flash.style.left='50%'; flash.style.top='50%'; }
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  let revealed = false;
  const reveal = ()=>{ if(revealed) return; revealed = true; ov.classList.add('show'); flash.removeEventListener('animationend', reveal); };
  flash.addEventListener('animationend', reveal);
  setTimeout(reveal, 1450);
  document.getElementById('nodeTitle').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;vertical-align:-4px;">${ICONS[cat.id]}</svg> ${cat.name}`;

function saveNode(){

function computeFastStreak(n){
  let s=0, d=new Date();
  while(true){ const key=d.toISOString().slice(0,10); if(n.fastLog[key]){ s++; d.setDate(d.getDate()-1); } else break; }
  return s;
}

ادّيه نصيحة عملية قصيرة (٤-٦ أسطر) تساعده يقرب من هدفه في الجانب ده بس.`;
  try{
    const res = await sampleFn(prompt, {onText:({text})=>{ txt.textContent=text; }});
    txt.textContent = res.text;
  }catch(e){ txt.textContent='حصل خطأ، حاول تاني.'; }
}

document.getElementById('aiOverviewBtn').onclick = async ()=>{
  document.getElementById('aiOv').classList.add('show');
  const txt = document.getElementById('aiOverviewText');
  txt.textContent='جاري التحليل...';
  if(!sampleFn){ txt.textContent='الذكاء الاصطناعي مش متاح دلوقتي في هذا العرض.'; return; }
  let summary = `رؤيته (Purpose): ${DATA.purpose.text||'لسه مكتبهاش'}\n\n`;
  CATS.forEach(c=>{
    const n = DATA.nodes[c.id];
    summary += `${c.name}: فين واقف=${n.whereAt||'-'} | فين عايز يوصل=${n.whereTo||'-'} | تقدم=${n.progress}% | أهداف=${n.goals.map(g=>g.name+(g.done?'(تم)':'')).join(',')||'-'}\n`;
  });
  const prompt = `انت مستشار حياة بيتكلم عربي مصري بسيط ودافئ ومباشر. دي بيانات نظام حياة المستخدم على شكل ستة جوانب حوالين هدف مركزي.
${summary}
اديله نظرة شاملة (٨-١٠ أسطر): فين هو قوي، فين محتاج اهتمام أكتر دلوقتي، وهل في ربط بين الجوانب المهملة وبعض. كن صريح ومحفز مش نظري.`;
  try{
    const res = await sampleFn(prompt, {onText:({text})=>{ txt.textContent=text; }});
    txt.textContent = res.text;
  }catch(e){ txt.textContent='حصل خطأ، حاول تاني.'; }
};

layout();
refreshPurposePreview();
document.getElementById('exportBtn').onclick = async ()=>{
  if(!downloadsFn) return;
  try{ await downloadsFn.save({filename:'hexlife-backup.json', data: JSON.stringify(DATA, null, 2)}); }catch(e){}
};
document.getElementById('importInput').onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{ const parsed = JSON.parse(reader.result); DATA = parsed; save(); location.reload(); }catch(err){}
  };
  reader.readAsText(f);
};
</script>
